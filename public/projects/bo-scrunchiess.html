<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BO Scrunchiess — Satin hair accessories</title>
<meta name="description" content="Satin bonnets, scrunchies, bows, gift boxes and more from BO Scrunchiess, on one page.">
<meta name="theme-color" content="#fbf7f3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.markatty.store">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@400;500;600&display=swap">
<style>
/* BO Scrunchiess — The one-page hair gift boutique */
:root{
  --silk:#fbf7f3; --pearl:#fff; --lilac:#efe3f2; --lilac-d:#d9c2e1; --orchid:#b8679f; --orchid-d:#97487f;
  --berry:#5b1838; --berry-d:#3f0f27; --champ:#eadbc4; --cocoa:#2d2126; --mute:#6f6168; --line:#e8dde2;
  --display:"Bodoni Moda",Didot,"Bodoni 72","Times New Roman",serif;
  --ui:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --gut:18px; --max:1280px; --hdr:60px;
  --ease:cubic-bezier(.22,.7,.2,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--silk);color:var(--cocoa);font:400 16px/1.55 var(--ui);overflow-x:hidden}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--orchid-d);outline-offset:3px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
.wrap{max-width:var(--max);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:10px;top:-60px;z-index:200;background:var(--berry);color:#fff;padding:10px 14px;border-radius:8px}
.skip:focus{top:10px}
@media (min-width:768px){:root{--gut:32px;--hdr:68px}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;height:var(--hdr);background:rgba(251,247,243,.9);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr .wrap{height:100%;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--berry)}
.brand{align-items:center}
.brand img{height:40px;width:auto}
.brand img+.bt{display:none}
.brand b{font:600 26px/1 var(--display);letter-spacing:-.02em}
.brand span{font:500 12px/1 var(--ui);letter-spacing:.32em;text-transform:uppercase;color:var(--orchid-d)}
@media (max-width:359px){.brand span{display:none}}
.now{margin-inline-start:auto;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;pointer-events:none;min-width:0}
.now.on{opacity:1;transform:none;pointer-events:auto}
.now button{border:1px solid var(--line);background:#fff;border-radius:999px;height:36px;padding:0 14px 0 6px;display:flex;align-items:center;gap:8px;font-size:14px;max-width:46vw}
.now button img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none}
.now button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bagbtn{margin-inline-start:auto;flex:none;position:relative;height:42px;min-width:42px;border-radius:999px;border:0;background:var(--berry);color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:500;letter-spacing:.02em}
.now.on+.bagbtn{margin-inline-start:0}
.bagbtn svg{width:20px;height:20px}
.bagbtn .n{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--lilac);color:var(--berry);font-size:12px;font-weight:600;display:grid;place-items:center}
.bagbtn.bump{animation:bump .5s var(--ease)}
@keyframes bump{30%{transform:scale(1.12)}60%{transform:scale(.96)}}
@media (max-width:599px){.bagbtn .lbl{display:none}.bagbtn{padding:0 10px}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:28px 0 8px}
.hero-grid{display:grid;gap:26px;align-items:center}
.hero h1{font:500 clamp(42px,11vw,96px)/.95 var(--display);letter-spacing:-.035em;margin:0;color:var(--berry-d)}
.hero h1 em{font-style:italic;font-weight:400}
.hero p{font-size:17px;color:var(--mute);margin:18px 0 24px;max-width:34ch}
.cta{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 26px;border-radius:999px;background:var(--berry);color:#fff;text-decoration:none;font-weight:500;letter-spacing:.03em;border:0}
.cta:hover{background:var(--berry-d)}
.cta svg{width:18px;height:18px}
.arch{position:relative;border-radius:999px 999px 28px 28px;overflow:hidden;background:var(--lilac);aspect-ratio:4/5;box-shadow:0 40px 60px -40px rgba(91,24,56,.45)}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hero-art{position:relative;max-width:520px;width:100%;margin-inline:auto}
.hero-art .small{position:absolute;width:38%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 20px 40px -20px rgba(91,24,56,.5);border:6px solid var(--silk);inset-inline-start:-6%;bottom:6%}
.hero-art .small img{width:100%;height:100%;object-fit:cover;transform:scale(1.7);transform-origin:50% 28%}
.hero-art .tag{position:absolute;inset-inline-end:-2%;top:14%;background:var(--silk);border:1px solid var(--line);padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.35;max-width:170px;box-shadow:0 14px 30px -18px rgba(91,24,56,.4)}
.hero-art .tag b{display:block;font:500 18px/1.2 var(--display);color:var(--berry)}
.ribbon{position:absolute;inset:0;pointer-events:none;z-index:-1;width:100%;height:100%}
.ribbon path{fill:none;stroke:var(--lilac-d);stroke-width:14;stroke-linecap:round;opacity:.55}
.ribbon path.hl{stroke:#fff;stroke-width:3;opacity:.8}
@media (min-width:900px){
  .hero{padding:48px 0 20px}
  .hero-grid{grid-template-columns:1.1fr .9fr;gap:56px}
  .arch{aspect-ratio:4/5;max-height:620px}
}
@media (max-width:899px){
  .hero{padding-top:20px}
  .hero-art{max-width:none}
  .arch{aspect-ratio:auto;height:clamp(220px,58vw,340px);border-radius:999px 999px 24px 24px/240px 240px 24px 24px}
  .hero-art .small{width:min(30%,120px);inset-inline-start:auto;inset-inline-end:4%;bottom:-8%}
  .hero-art .tag{display:none}
  .hero-copy{text-align:left}
}

/* ---------- category selector ---------- */
.picker{padding-top:36px;padding-bottom:18px;scroll-margin-top:var(--hdr)}
.picker h2{font:500 clamp(24px,5vw,34px)/1.1 var(--display);margin:0 0 4px;color:var(--berry-d)}
.picker p{margin:0 0 18px;color:var(--mute)}
.cats{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 2px 14px;scrollbar-width:none;margin:0 calc(var(--gut)*-1);padding-inline:var(--gut)}
.cats::-webkit-scrollbar{display:none}
.cats{scroll-padding-inline:var(--gut)}
@media (max-width:899px){.frame{aspect-ratio:1/1.08}.shape-arch .frame{border-radius:200px 200px 24px 24px}}
.cat{flex:none;scroll-snap-align:start;width:112px;border:0;background:transparent;padding:0;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:8px}
.cat .ring{position:relative;width:100px;height:100px;border-radius:50%;padding:5px;background:conic-gradient(from 200deg,var(--lilac-d),var(--champ),var(--lilac),var(--lilac-d));transition:transform .35s var(--ease)}
.cat .ring img,.cat .ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--silk)}
.cat .nm{font-size:14px;font-weight:500;line-height:1.2}
.cat .ct{font-size:12px;color:var(--mute)}
.cat:hover .ring{transform:translateY(-3px)}
.cat[aria-current=true] .ring{background:conic-gradient(from 200deg,var(--berry),var(--orchid),var(--berry))}
.cat[aria-current=true] .nm{color:var(--berry)}
@media (min-width:1200px){.cats{justify-content:space-between;overflow:visible;margin:0;padding-inline:0}.cat{width:auto;flex:1}}

/* ---------- category stage ---------- */
.stage{position:relative;padding-top:72px;padding-bottom:64px;scroll-margin-top:var(--hdr);isolation:isolate}
.stage::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg,transparent)}
.stage.t-lilac{--bg:linear-gradient(180deg,var(--silk),var(--lilac) 40%,var(--silk))}
.stage.t-champ{--bg:linear-gradient(180deg,var(--silk),#f4ebdd 45%,var(--silk))}
.stage.t-blush{--bg:linear-gradient(180deg,var(--silk),#f8e7ec 45%,var(--silk))}
.stage.t-berry{--bg:var(--berry-d);color:#f7e9ef}
.stage.t-berry .s-head h2,.stage.t-berry .f-name{color:#fff}
.stage.t-berry .s-head p,.stage.t-berry .f-desc,.stage.t-berry .f-meta{color:#dcc3cf}
.stage.t-berry .chip{background:transparent;color:#f7e9ef;border-color:rgba(255,255,255,.3)}
.stage.t-berry .chip[aria-pressed=true]{background:#fff;color:var(--berry-d);border-color:#fff}
.stage.t-berry .qty{border-color:rgba(255,255,255,.3)}
.stage.t-berry .add{background:var(--lilac);color:var(--berry-d)}
.stage.t-berry .add:hover{background:#fff}
.stage.t-berry .pc{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
.stage.t-berry .pc[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 1px #fff}
.stage.t-berry .pc .rn,.stage.t-berry .pc .rp{color:#f7e9ef}
.stage.t-berry .price-now{color:#fff}
.stage.t-berry .price-was{color:#cfb2c0}
.s-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:28px}
.s-title{min-width:0}
.s-title p{margin-top:8px!important}
.s-head h2{font:400 clamp(40px,10vw,84px)/.92 var(--display);letter-spacing:-.03em;margin:0;color:var(--berry-d)}
.s-head p{margin:0;color:var(--mute);font-size:15px;max-width:40ch}
.s-head .mood{flex:none;width:64px;height:80px;border-radius:999px 999px 14px 14px;overflow:hidden;background:#fff;box-shadow:0 14px 24px -16px rgba(63,15,39,.6)}
.s-head .mood img{width:100%;height:100%;object-fit:cover}
.s-head{position:relative}
@media (min-width:900px){.s-head .mood{width:96px;height:120px}}
.pattern{height:120px;background-size:520px auto;background-position:center;opacity:.9}
@media (min-width:768px){.pattern{height:160px;background-size:760px auto}}
.compo{display:grid;gap:24px;align-items:start}
.col{min-width:0}
.col .rail-h{margin-top:30px}
.feature{position:relative}
.frame{position:relative;overflow:hidden;background:#fff;aspect-ratio:4/5;border-radius:28px;box-shadow:0 50px 70px -50px rgba(63,15,39,.55)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .55s var(--ease),transform 1.2s var(--ease)}
.frame img.wide{object-fit:contain;background:#fff}
.frame img.out{opacity:0;transform:scale(1.035)}
.frame .noimg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mute);font-size:14px;background:repeating-linear-gradient(135deg,#fbf3f7 0 14px,#f6ecf1 14px 28px)}
.shape-arch .frame{border-radius:999px 999px 28px 28px}
.shape-oval .frame{border-radius:50%/42%}
.gal-nav{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;align-items:center;z-index:2}
.gal-nav button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:var(--berry);display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.gal-nav button svg{width:18px;height:18px}
.gal-nav .cnt{background:rgba(255,255,255,.88);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--berry);min-width:64px;text-align:center}
html[dir=rtl] .gal-nav svg{transform:scaleX(-1)}
.details{position:relative}
.f-meta{font-size:13px;letter-spacing:.08em;color:var(--orchid-d);margin:0 0 8px}
.f-name{font:500 clamp(28px,6vw,46px)/1.05 var(--display);letter-spacing:-.02em;margin:0 0 12px;color:var(--berry-d)}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.price-now{font:600 26px/1 var(--ui);color:var(--berry)}
.price-was{font-size:16px;color:var(--mute);text-decoration:line-through}
.price-off{font-size:13px;font-weight:600;background:var(--lilac);color:var(--berry);padding:3px 9px;border-radius:999px}
.f-desc{color:var(--mute);margin:0 0 18px;max-width:46ch;white-space:pre-line}
.opt{margin:0 0 16px;border:0;padding:0}
.opt legend{font-size:13px;font-weight:600;letter-spacing:.06em;margin-bottom:8px;padding:0}
.opt legend span{font-weight:400;color:var(--mute);letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px}
.chip[aria-pressed=true]{background:var(--berry);color:#fff;border-color:var(--berry)}
.chips.clamp .chip:nth-child(n+13){display:none}
.opt .more{border:0;background:none;padding:8px 0 0;color:var(--orchid-d);text-decoration:underline;font-size:14px}
.stage.t-berry .opt .more{color:#f3c6dc}
.chip:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.buy{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:6px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:52px;padding:0 4px}
.qty button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;font-size:22px;line-height:1}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty output{min-width:28px;text-align:center;font-weight:600}
.add{flex:1;min-width:180px;height:52px;border-radius:999px;border:0;background:var(--berry);color:#fff;font-weight:500;letter-spacing:.03em;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .15s}
.add:hover{background:var(--berry-d)}
.add:active{transform:scale(.98)}
.add:disabled{background:#d8ccd2;color:#6f6168;cursor:not-allowed}
.add .ok{display:none}
.add.done .ok{display:inline}.add.done .lbl{display:none}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.stage.t-berry .note{color:#cfb2c0}

/* supporting products */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 10px;scrollbar-width:thin}
.pc{flex:none;scroll-snap-align:start;width:132px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px;text-align:start;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .25s var(--ease)}
.pc:hover{transform:translateY(-3px)}
.pc[aria-pressed=true]{border-color:var(--berry);box-shadow:0 0 0 1px var(--berry)}
.pc .ri{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#f6eff3}
.pc .ri img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .rn{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pc .rp{font-size:13px;font-weight:600;color:var(--berry)}
.rail-h{font-size:13px;letter-spacing:.06em;font-weight:600;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.stage.t-berry .rail-h{color:#f7e9ef}

/* composition variants */
@media (min-width:900px){
  .compo{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px}
  .v-right .feature{order:2}
  .v-right .col{order:1}
  .compo>.col{align-self:center}
  .frame{aspect-ratio:4/5;max-height:76vh}
  .v-orbit .compo{grid-template-columns:1fr}
  .v-orbit .orbit{position:relative;display:grid;grid-template-columns:1fr minmax(0,460px) 1fr;align-items:center;gap:36px}
  .v-orbit .orbit .feature{grid-column:2}
  .v-orbit .orbit .side{display:flex;flex-direction:column;gap:14px}
  .v-orbit .orbit .side.l{grid-column:1;grid-row:1;align-items:flex-end}
  .v-orbit .orbit .side.r{grid-column:3;grid-row:1;align-items:flex-start}
  .v-orbit .side button{width:150px}
  .v-orbit .side button:nth-child(2){transform:translateX(-24px)}
  .v-orbit .side.r button:nth-child(2){transform:translateX(24px)}
  .v-orbit .details{max-width:640px;margin:0 auto;text-align:center}
  .v-orbit .price,.v-orbit .chips,.v-orbit .buy{justify-content:center}
  .v-orbit .f-desc{margin-inline:auto}
}
.side{display:none}
@media (min-width:900px){.v-orbit .side{display:flex}.v-orbit .rail-wrap.orbit-extra{display:block}.v-orbit .rail-wrap.orbit-hide{display:none}}

/* reveal choreography */
.js .stage .frame{clip-path:inset(12% 8% 0 8% round 28px);opacity:.001;transition:clip-path 1s var(--ease),opacity .6s}
.js .stage .details>*{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.js .stage .rail button,.js .stage .side button{opacity:0;transform:translateY(16px)}
.js .stage.in .frame{clip-path:inset(0 0 0 0 round 28px);opacity:1}
.js .stage.in.shape-arch .frame{clip-path:none}
.js .stage.in .details>*{opacity:1;transform:none}
.js .stage.in .rail button,.js .stage.in .side button{opacity:1;transform:none;transition:opacity .5s var(--ease) calc(var(--i,0)*70ms + .25s),transform .5s var(--ease) calc(var(--i,0)*70ms + .25s),border-color .2s}
.js .stage.in .details>*:nth-child(2){transition-delay:.08s}.js .stage.in .details>*:nth-child(3){transition-delay:.14s}.js .stage.in .details>*:nth-child(4){transition-delay:.2s}.js .stage.in .details>*:nth-child(n+5){transition-delay:.26s}
.js .stage.shape-arch .frame{clip-path:none;opacity:0;transform:translateY(24px) scale(.98);transition:opacity .9s var(--ease),transform 1s var(--ease)}
.js .stage.in.shape-arch .frame{opacity:1;transform:none}
.drift{transition:transform .2s linear}
@media (prefers-reduced-motion:reduce){
  .js .stage .frame,.js .stage .details>*,.js .stage .rail button,.js .stage .side button{clip-path:none!important;opacity:1!important;transform:none!important;transition:none!important}
  .frame img{transition:opacity .2s}
  .frame img.wide{object-fit:contain;background:#fff}
.frame img.out{transform:none}
  .bagbtn.bump{animation:none}
  .ribbon path{stroke-dashoffset:0!important;transition:none!important}
}

/* ---------- bag ---------- */
.scrim{position:fixed;inset:0;background:rgba(45,33,38,.45);z-index:80;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.bag{position:fixed;top:0;bottom:0;right:0;width:min(440px,100%);z-index:90;background:var(--silk);display:flex;flex-direction:column;transform:translateX(104%);transition:transform .35s var(--ease);box-shadow:-30px 0 60px -30px rgba(63,15,39,.5)}
.bag.on{transform:none}
.bag-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.bag-h h2{margin:0;font:500 28px/1 var(--display);color:var(--berry-d)}
.x{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.bag-b{flex:1;overflow:auto;padding:6px 18px}
.bag-f{border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));background:#fff}
.line{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.line .th{width:72px;height:88px;border-radius:12px;overflow:hidden;background:#f6eff3}
.line .th img{width:100%;height:100%;object-fit:cover}
.line h3{margin:0;font:500 17px/1.2 var(--display)}
.line .v{font-size:13px;color:var(--mute);margin:3px 0 8px}
.line .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.line .qty{height:38px}
.line .qty button{width:32px;height:32px;font-size:18px}
.line .lt{margin-inline-start:auto;font-weight:600}
.rm{border:0;background:none;color:var(--orchid-d);text-decoration:underline;font-size:13px;padding:4px 0}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0}
.sum.big{font-size:20px;font-weight:600;margin:6px 0}
.bag-f .note{margin:0 0 12px}
.btn-wide{width:100%;height:52px;border-radius:999px;border:0;background:var(--berry);color:#fff;font-weight:500;letter-spacing:.03em}
.empty{text-align:center;padding:48px 10px;color:var(--mute)}

<script>
(function(){
'use strict';
const D = window.BO, S = D.store;
const PR = D.products; // id -> product
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const fmt = n => n.toLocaleString('en-US', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});
const egp = n => `${fmt(n)} EGP`;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const IC = {
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'
};

/* ---------- product helpers ---------- */
const hasVars = p => p.vars.length > 0;
function varIndex(p, choice){ // choice: array of option values
  const k = choice.join(' / '); return p.vars.findIndex(v => v.k === k);
}
function priceOf(p, vi){ const v = vi >= 0 ? p.vars[vi] : null; return v ? {now:v.now, was:v.was, off:v.off} : {now:p.now, was:p.was, off:p.off}; }
function availOf(p, vi){ if (vi >= 0) return !!p.vars[vi].avail; return !p.soldOut; }
const anyAvail = p => hasVars(p) ? p.vars.some(v => v.avail) : !p.soldOut;
const img = (u, cls='', lazy=true, alt='') => `<img${cls?` class="${cls}"`:''} src="${esc(u)}" alt="${esc(alt)}"${lazy?' loading="lazy"':''} decoding="async" referrerpolicy="no-referrer">`;
const noPhoto = '<div class="noimg">Photo not available yet</div>';
// image failure → honest placeholder
document.addEventListener('error', e => {
  const t = e.target; if (!(t instanceof HTMLImageElement)) return;
  if (t.closest('.frame')) { t.replaceWith(Object.assign(document.createElement('div'), {className:'noimg', textContent:'Photo not available yet'})); }
  else t.style.visibility = 'hidden';
}, true);

/* ---------- state ---------- */
const sel = {};   // pid -> array of chosen option values
const photo = {}; // pid -> image index
const feat = {};  // catId -> pid
const qtyPick = {}; // pid -> qty to add
const openOpts = {}; // 'pid|group' -> expanded
for (const p of Object.values(PR)) {
  if (hasVars(p)) { const first = p.vars.find(v => v.avail) || p.vars[0]; sel[p.id] = first.k.split(' / '); photo[p.id] = first.img >= 0 ? first.img : 0; }
  else { sel[p.id] = []; photo[p.id] = 0; }
  qtyPick[p.id] = 1;
}
const curVi = p => hasVars(p) ? varIndex(p, sel[p.id]) : -1;

/* ---------- layouts per category (composition, frame shape, mood) ---------- */
const LOOKS = [
  {v:'v-left', shape:'shape-arch', t:'t-lilac'},
  {v:'v-right', shape:'', t:'t-champ'},
  {v:'v-orbit', shape:'shape-oval', t:'t-blush'},
  {v:'v-left', shape:'', t:'t-lilac'},
  {v:'v-right', shape:'shape-arch', t:'t-champ'},
];
function lookFor(cat, i){
  if (/box/i.test(cat.name)) return {v: cat.items.length > 2 ? 'v-orbit' : 'v-left', shape:'', t:'t-berry'};
  const L = LOOKS[i % LOOKS.length];
  if (L.v === 'v-orbit' && cat.items.length < 4) return {v:'v-left', shape:L.shape, t:L.t};
  return L;
}
function pickFeatured(cat){ // first piece (store order) that can be bought and has a photo
  return cat.items.find(id => anyAvail(PR[id]) && PR[id].imgs.length) || cat.items.find(id => PR[id].imgs.length) || cat.items[0];
}

/* ---------- render: hero ---------- */
function hero(){
  const nP = Object.keys(PR).length, nC = D.cats.length;
  $('#heroP').textContent = `Satin bonnets, scrunchies, bows, heatless curls and gift boxes from BO Scrunchiess — ${nP} pieces across ${nC} categories, all on one page.`;
  const camp = D.hero.filter(h => h.role !== 'pattern');
  $('#heroArt').innerHTML = `<div class="arch">${camp[0] ? img(camp[0].src, '', false, camp[0].alt) : noPhoto}</div>
    ${camp[1] ? `<div class="small">${img(camp[1].src, '', false, camp[1].alt)}</div>` : ''}
    <div class="tag"><b>${nP} pieces</b>bonnets, bows, scrunchies and gift boxes</div>`;
  // ribbon draw-in: the one orchestrated page-load moment
  if (!RM.matches) $$('#ribbon path').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset 2.4s cubic-bezier(.6,.05,.2,1) .2s'; p.style.strokeDashoffset = 0; });
}

/* ---------- render: category selector ---------- */
function picker(){
  $('#cats').innerHTML = D.cats.map(c => { const f = PR[pickFeatured(c)];
    const th = c.mood ? c.mood.src : (f && f.imgs[0]);
    return `<a class="cat" href="#${c.slug}" data-go="${c.slug}" aria-current="false"><span class="ring">${th ? img(th, '', false, '') : '<span class="ph"></span>'}</span><span class="nm">${esc(c.name)}</span><span class="ct">${c.items.length} ${c.items.length === 1 ? 'piece' : 'pieces'}</span></a>`; }).join('');
}

/* ---------- render: stages ---------- */
function railBtn(cat, id, i){
  const p = PR[id]; const pr = priceOf(p, curVi(p));
  return `<button type="button" class="pc" data-pick="${esc(cat.slug)}|${esc(id)}" aria-pressed="${feat[cat.id] === id}" style="--i:${i}" aria-label="Show ${esc(p.name)}, ${egp(pr.now)}">
    <span class="ri">${p.imgs.length ? img(p.imgs[0]) : ''}</span><span class="rn">${esc(p.name)}</span><span class="rp">${egp(pr.now)}${anyAvail(p) ? '' : ' · sold out'}</span></button>`;
}
function stage(cat, i){
  const L = lookFor(cat, i); cat.look = L;
  feat[cat.id] = pickFeatured(cat);
  const solo = cat.items.length === 1;
  const others = cat.items.filter(id => id !== feat[cat.id]);
  const orbit = L.v === 'v-orbit';
  const head = `<div class="s-head">${cat.mood ? `<span class="mood">${img(cat.mood.src, '', true, cat.mood.alt)}</span>` : ''}<div class="s-title"><h2 id="h-${cat.slug}">${esc(cat.name)}</h2><p>${solo ? 'One piece in this category.' : `${cat.items.length} pieces. Choose one to see it up close.`}</p></div></div>`;
  const feature = `<div class="feature"><div class="frame" data-frame></div><div class="gal-nav" data-gal></div></div>`;
  const rail = solo ? '' : `<div class="rail-wrap ${orbit && others.length <= 4 ? 'orbit-hide' : ''}"><p class="rail-h"><span>All ${cat.items.length} in ${esc(cat.name)}</span></p><div class="rail" data-rail>${cat.items.map((id, k) => railBtn(cat, id, k)).join('')}</div></div>`;
  let compo;
  if (orbit) compo = `<div class="compo"><div class="orbit"><div class="side l" data-side="l"></div>${feature}<div class="side r" data-side="r"></div></div><div class="details" data-details></div></div>${rail}`;
  else compo = `<div class="compo">${feature}<div class="col"><div class="details" data-details></div>${rail}</div></div>`;
  return `<section class="stage ${L.v} ${L.shape} ${L.t}${solo ? ' solo' : ''}" id="${cat.slug}" data-cat="${cat.id}" aria-labelledby="h-${cat.slug}"><div class="wrap">${head}${compo}</div></section>`;
}
function fillStage(cat, animate){
  const sec = document.getElementById(cat.slug); const p = PR[feat[cat.id]];
  setFrame(sec, p, animate);
  renderDetails(sec, cat, p);
  // rail + orbit sides
  $$('[data-pick]', sec).forEach(b => b.setAttribute('aria-pressed', b.dataset.pick.split('|')[1] === p.id));
  if (cat.look.v === 'v-orbit') {

    const l = $('[data-side=l]', sec), r = $('[data-side=r]', sec);

    r.innerHTML = others.filter((_, k) => k % 2 === 1).map((id, k) => railBtn(cat, id, k + 1)).join('');
    $$('.side button', sec).forEach(b => b.classList.add('orb'));

}
function setFrame(sec, p, animate){
  const fr = $('[data-frame]', sec), nav = $('[data-gal]', sec);
  const n = p.imgs.length, k = Math.min(photo[p.id] || 0, Math.max(n - 1, 0));
  if (!n) { fr.innerHTML = noPhoto; nav.innerHTML = ''; return; }
  const src = p.imgs[k]; const old = $$('img', fr);
  if (old.length && old[old.length-1].getAttribute('src') === src) { /* same */ }
  else {
    const im = document.createElement('img'); im.onload = () => { if (im.naturalWidth > im.naturalHeight * 1.05) im.classList.add('wide'); }; im.src = src; im.alt = `${p.name}${n > 1 ? ` — photo ${k+1} of ${n}` : ''}`; im.decoding = 'async'; im.referrerPolicy = 'no-referrer';
    if (animate && !RM.matches && old.length) { im.className = 'out'; fr.appendChild(im); requestAnimationFrame(() => requestAnimationFrame(() => im.classList.remove('out'))); old.forEach(o => { o.classList.add('out'); setTimeout(() => o.remove(), 600); }); }
    else { fr.innerHTML = ''; fr.appendChild(im); $$('.noimg', fr).forEach(x => x.remove()); }
  }
  nav.innerHTML = n > 1 ? `<button type="button" data-ph="${esc(p.id)}|-1" aria-label="Previous photo">${IC.prev}</button><span class="cnt" aria-live="polite">${k+1} / ${n}</span><button type="button" data-ph="${esc(p.id)}|1" aria-label="Next photo">${IC.next}</button>` : '';
}
function renderDetails(sec, cat, p){
  const vi = curVi(p), pr = priceOf(p, vi), ok = availOf(p, vi);
  const opts = p.opts.map((o, gi) => {
    const chosen = sel[p.id][gi];
    const many = o.values.length > 12, open = openOpts[p.id + '|' + gi] || o.values.indexOf(chosen) >= 12;
    return `<fieldset class="opt"><legend>${esc(o.label)}: <span dir="auto">${esc(chosen || '')}</span></legend><div class="chips${many && !open ? ' clamp' : ''}">${o.values.map(val => {
      // a value is selectable if some available variant uses it together with the other current choices
      const trial = sel[p.id].slice(); trial[gi] = val; const tv = varIndex(p, trial);
      const can = tv >= 0 && p.vars[tv].avail;
      return `<button type="button" class="chip" dir="auto" data-opt="${esc(p.id)}|${gi}|${esc(val)}" aria-pressed="${chosen === val}"${can ? '' : ' disabled aria-disabled="true"'}>${esc(val)}${can ? '' : '<span class="sr"> (sold out)</span>'}</button>`;
    }).join('')}</div>${many ? `<button type="button" class="more" data-more="${esc(p.id)}|${gi}" aria-expanded="${!!open}">${open ? 'Show fewer' : `Show all ${o.values.length} ${o.label === 'Colour' ? 'colours' : 'options'}`}</button>` : ''}</fieldset>`;

    <p class="price"><span class="price-now">${egp(pr.now)}</span>${pr.was ? `<span class="price-was"><span class="sr">was </span>${egp(pr.was)}</span>` : ''}${pr.off ? `<span class="price-off">${esc(pr.off)}</span>` : ''}</p>
    ${p.desc ? `<p class="f-desc">${esc(p.desc)}</p>` : ''}
    ${opts}
    <div class="buy"><div class="qty" role="group" aria-label="Quantity"><button type="button" data-q="${esc(p.id)}|-1" aria-label="Decrease quantity"${q <= 1 ? ' disabled' : ''}>−</button><output aria-live="polite">${q}</output><button type="button" data-q="${esc(p.id)}|1" aria-label="Increase quantity">+</button></div>
      <button type="button" class="add" data-add="${esc(p.id)}"${ok ? '' : ' disabled'}><span class="lbl">${ok ? 'Add to bag' : 'Sold out'}</span><span class="ok">${IC.check} Added</span></button></div>
    <p class="note">${ok ? esc(S.delivery) : 'This option is sold out on the store right now.'}</p>`;
}

/* ---------- bag ---------- */
let BAG = [];
try { const raw = JSON.parse(localStorage.getItem('bo.bag.v1') || '[]'); BAG = raw.filter(l => PR[l.id] && l.q > 0 && (l.v === '' || PR[l.id].vars.some(v => v.k === l.v && v.avail))); } catch(e) { BAG = []; }
const save = () => { try { localStorage.setItem('bo.bag.v1', JSON.stringify(BAG)); } catch(e){} };
const lineUnit = l => { const p = PR[l.id]; const vi = l.v ? p.vars.findIndex(v => v.k === l.v) : -1; return priceOf(p, vi).now; };
const lineImg = l => { const p = PR[l.id]; const v = l.v ? p.vars.find(x => x.k === l.v) : null; return p.imgs[v && v.img >= 0 ? v.img : 0]; };
const count = () => BAG.reduce((a, l) => a + l.q, 0);
const subtotal = () => Math.round(BAG.reduce((a, l) => a + lineUnit(l) * l.q, 0) * 100) / 100;
function addToBag(id, q){
  const p = PR[id], vi = curVi(p);
  if (!availOf(p, vi)) return false;
  const v = vi >= 0 ? p.vars[vi].k : '';
  const ex = BAG.find(l => l.id === id && l.v === v);
  if (ex) ex.q = Math.min(99, ex.q + q); else BAG.push({id, v, q: Math.min(99, q)});
  save(); syncBag(); return true;
}
function syncBag(){
  const n = count();
  $('#bagN').textContent = n; $('#bagSr').textContent = n === 1 ? 'item in your bag' : 'items in your bag';
  $('#bagBtn').setAttribute('aria-label', `Bag, ${n} ${n === 1 ? 'item' : 'items'}${n ? ', ' + egp(subtotal()) : ''}`);
  if ($('#bag').classList.contains('on') && !chkMode) renderBag();
}
let chkMode = false;
function renderBag(){
  chkMode = false;
  const B = $('#bagBody'), F = $('#bagFoot');
  if (!BAG.length) {
    B.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg><h3>Your bag is empty</h3><p>Pick a category and add the pieces you love.</p><button class="cta" type="button" data-act="shop">Choose a category</button></div>`;
    F.innerHTML = ''; return;
  }
  B.innerHTML = BAG.map((l, i) => { const p = PR[l.id], u = lineUnit(l), im = lineImg(l);
    return `<div class="line"><div class="th">${im ? img(im, '', true, '') : ''}</div><div><h3>${esc(p.name)}</h3><p class="v">${l.v ? esc(p.opts.map(o => o.label).join(' / ')) + ': ' + esc(l.v) + ' · ' : ''}${egp(u)} each</p>
      <div class="row"><div class="qty" role="group" aria-label="Quantity of ${esc(p.name)}"><button type="button" data-bq="${i}|-1" aria-label="Decrease">−</button><output>${l.q}</output><button type="button" data-bq="${i}|1" aria-label="Increase"${l.q >= 99 ? ' disabled' : ''}>+</button></div>
      <button class="rm" type="button" data-rm="${i}">Remove<span class="sr"> ${esc(p.name)}</span></button><span class="lt">${egp(Math.round(u * l.q * 100) / 100)}</span></div></div></div>`; }).join('');
  F.innerHTML = `<div class="sum"><span>${count()} ${count() === 1 ? 'item' : 'items'}</span></div><div class="sum big"><span>Subtotal</span><span>${egp(subtotal())}</span></div><p class="note">Shipping isn’t included. BO Scrunchiess confirms it when you order.</p><button class="btn-wide" type="button" data-act="review">Review order</button>`;
}
function orderText(){
  return 'BO Scrunchiess order\n' + BAG.map(l => { const p = PR[l.id]; return `${l.q} × ${p.name}${l.v ? ' (' + l.v + ')' : ''} — ${egp(Math.round(lineUnit(l) * l.q * 100) / 100)}`; }).join('\n') + `\nSubtotal: ${egp(subtotal())}`;
}
function renderReview(){
  chkMode = true;
  $('#bagBody').innerHTML = `<div class="chk"><button class="linkback" type="button" data-act="back">Back to bag</button><h3>Review your order</h3>
    <p class="demo">This page is a design preview. It can’t place orders or take payments. To order, send this list to BO Scrunchiess, or add the same pieces on the official store.</p>
    <ul>${BAG.map(l => { const p = PR[l.id]; return `<li><span>${l.q} × ${esc(p.name)}${l.v ? ` <small>(${esc(l.v)})</small>` : ''}</span><span>${egp(Math.round(lineUnit(l) * l.q * 100) / 100)}</span></li>`; }).join('')}</ul>
    <div class="sum big"><span>Subtotal</span><span>${egp(subtotal())}</span></div><p class="note">Shipping isn’t included.</p>
    <div class="contact"><button type="button" data-act="copy">Copy order list</button><a href="mailto:${S.email}?subject=${encodeURIComponent('Order from BO Scrunchiess website')}&body=${encodeURIComponent(orderText())}">Email ${esc(S.email)}</a><a href="tel:${S.phone}">Call ${esc(S.phoneTxt)}</a><a href="${S.site}" target="_blank" rel="noopener">Open the official store</a></div></div>`;
  $('#bagFoot').innerHTML = '';
}
let lastFocus = null;
function openBag(){
  lastFocus = document.activeElement; renderBag(); $('#toast').classList.remove('on');
  const b = $('#bag'), s = $('#scrim'); b.hidden = false; s.hidden = false;
  requestAnimationFrame(() => { b.classList.add('on'); s.classList.add('on'); });
  document.documentElement.style.overflow = 'hidden';
  setTimeout(() => $('[data-act=close]', b).focus(), 60);
}
function closeBag(){
  const b = $('#bag'), s = $('#scrim'); if (!b.classList.contains('on')) return;
  b.classList.remove('on'); s.classList.remove('on');
  setTimeout(() => { b.hidden = true; s.hidden = true; }, 360);

document.addEventListener('keydown', e => {
  if (!$('#bag').classList.contains('on')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeBag(); }
  if (e.key === 'Tab') { const f = $$('a[href],button:not([disabled])', $('#bag')); if (!f.length) return; const a = f[0], z = f[f.length-1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }

/* ---------- feedback ---------- */
let tt; function toast(m){ if ($('#bag').classList.contains('on')) return; const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2000); }
function fly(fromEl, src){
  const bb = $('#bagBtn'); bb.classList.remove('bump'); void bb.offsetWidth; bb.classList.add('bump');
  if (RM.matches || !fromEl || !src) return;
  const a = fromEl.getBoundingClientRect(), b = bb.getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'fly'; f.innerHTML = img(src, '', false, ''); document.body.appendChild(f);
  const x0 = a.left + a.width/2 - 32, y0 = a.top + a.height/2 - 32, x1 = b.left + b.width/2 - 32, y1 = b.top + b.height/2 - 32;
  f.animate([{transform:`translate(${x0}px,${y0}px) scale(1.4)`,opacity:1},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-80}px) scale(1)`,opacity:1,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.3)`,opacity:.3}],{duration:720,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish = () => f.remove();
}

/* ---------- interactions ---------- */
function goTo(id){
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({behavior: RM.matches ? 'auto' : 'smooth', block:'start'});
  history.replaceState(null, '', '#' + id);
  const h = $('h2', el) || el; h.setAttribute('tabindex', '-1'); setTimeout(() => h.focus({preventScroll:true}), RM.matches ? 0 : 500);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-pick],[data-opt],[data-more],[data-ph],[data-q],[data-add],[data-bq],[data-rm],[data-act]'); if (!t) return;
  const d = t.dataset;
  if (d.go) { e.preventDefault(); return goTo(d.go); }
  if (d.pick) { const [cs, id] = d.pick.split('|'); const cat = D.cats.find(c => c.slug === cs); if (feat[cat.id] === id) return; feat[cat.id] = id; fillStage(cat, true);
    if (matchMedia('(max-width:899px)').matches) { const fr = $('#' + cs + ' .feature'); const r = fr.getBoundingClientRect(); if (r.top < 60 || r.top > innerHeight * .5) window.scrollBy({top: r.top - 76, behavior: RM.matches ? 'auto' : 'smooth'}); }
    return; }
  if (d.opt) { const [id, gi, val] = d.opt.split('|'); const p = PR[id]; sel[id][+gi] = val;
    // keep the combination valid: if the new pair doesn't exist, choose the first available value for the other group
    if (varIndex(p, sel[id]) < 0 || !p.vars[varIndex(p, sel[id])].avail) { const m = p.vars.find(v => v.avail && v.k.split(' / ')[+gi] === val); if (m) sel[id] = m.k.split(' / '); }
    const vi = curVi(p); if (vi >= 0 && p.vars[vi].img >= 0) photo[id] = p.vars[vi].img;
    refreshProduct(id, true); return; }
  if (d.more) { openOpts[d.more] = !openOpts[d.more]; refreshProduct(d.more.split('|')[0], false); const b = $(`[data-more="${d.more}"]`); if (b) b.focus(); return; }
  if (d.ph) { const [id, dir] = d.ph.split('|'); const p = PR[id]; photo[id] = ((photo[id] || 0) + (+dir) + p.imgs.length) % p.imgs.length; refreshProduct(id, true, true); return; }
  if (d.q) { const [id, dir] = d.q.split('|'); qtyPick[id] = Math.max(1, Math.min(99, qtyPick[id] + (+dir))); refreshProduct(id, false); return; }
  if (d.add) { const id = d.add, p = PR[id];
    if (addToBag(id, qtyPick[id])) { const vi = curVi(p);
      toast(`Added ${qtyPick[id]} × ${p.name}${vi >= 0 ? ' (' + p.vars[vi].k + ')' : ''}`);
      fly($('[data-frame]', t.closest('.stage')), p.imgs[photo[id] || 0]);
      t.classList.add('done'); setTimeout(() => t.classList.remove('done'), 1400);
      qtyPick[id] = 1; const out = $('.qty output', t.closest('.buy')); if (out) out.textContent = '1'; const dec = $('[data-q$="|-1"]', t.closest('.buy')); if (dec) dec.disabled = true; }
    return; }
  if (d.bq) { const [i, dir] = d.bq.split('|').map(Number); const l = BAG[i]; if (!l) return; l.q += dir; if (l.q <= 0) BAG.splice(i, 1); save(); syncBag(); renderBag(); const f = $(`[data-bq="${Math.min(i, BAG.length-1)}|${dir}"]`); if (f) f.focus(); return; }
  if (d.rm) { const l = BAG[+d.rm]; BAG.splice(+d.rm, 1); save(); syncBag(); renderBag(); toast(`Removed ${PR[l.id].name}`); $('[data-act=close]').focus(); return; }
  switch (d.act) {

      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt, ok)); else fallbackCopy(txt, ok); return; }
  }
});
function fallbackCopy(txt, ok){ const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e){} ta.remove(); }
function refreshProduct(id, animate, photoOnly){
  for (const cat of D.cats) if (feat[cat.id] === id) { const sec = document.getElementById(cat.slug);
    const focusKey = document.activeElement && document.activeElement.dataset ? (document.activeElement.dataset.opt || document.activeElement.dataset.q || document.activeElement.dataset.ph) : null;
    setFrame(sec, PR[id], animate); if (!photoOnly) renderDetails(sec, cat, PR[id]);
    $$('[data-pick$="|' + id + '"] .rp', sec).forEach(e => { const p = PR[id]; e.textContent = egp(priceOf(p, curVi(p)).now) + (anyAvail(p) ? '' : ' · sold out'); });
    if (focusKey) { const f = $$('[data-opt],[data-q],[data-ph]', sec).find(x => (x.dataset.opt || x.dataset.q || x.dataset.ph) === focusKey); if (f && !f.disabled) f.focus(); } }
}
$('#bagBtn').addEventListener('click', openBag);
$('#scrim').addEventListener('click', closeBag);
$('#nowBtn').addEventListener('click', () => goTo('choose'));

/* ---------- scroll: reveals, current category, header ---------- */
function observe(){
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -12% 0px', threshold:.08});
  $$('.stage').forEach(s => io.observe(s));
  let cur = null;
  const spy = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) cur = e.target; });
    const pickerVisible = $('#choose').getBoundingClientRect().bottom > 70;
    const now = $('#now');
    if (cur && cur.dataset.cat && !pickerVisible) { const c = D.cats.find(x => String(x.id) === cur.dataset.cat); const f = PR[feat[c.id]];
      $('#nowTxt').textContent = c.name; $('#nowImg').src = f.imgs[0] || ''; $('#nowImg').referrerPolicy = 'no-referrer';
      $('#nowBtn').setAttribute('aria-label', `Now viewing ${c.name}. Go back to the category list`); now.classList.add('on'); now.removeAttribute('aria-hidden'); $('#nowBtn').tabIndex = 0;
      $$('.cat').forEach(a => a.setAttribute('aria-current', a.dataset.go === c.slug)); }
    else { now.classList.remove('on'); now.setAttribute('aria-hidden', 'true'); $('#nowBtn').tabIndex = -1; }
  }, {rootMargin:'-45% 0px -50% 0px'});
  $$('.stage,#choose,.hero').forEach(s => spy.observe(s));
}
// gentle in-frame drift of the featured photo while scrolling (desktop, motion allowed)
function drift(){
  if (RM.matches || !matchMedia('(min-width:900px) and (pointer:fine)').matches) return;
  let raf = 0;
  const run = () => { raf = 0; const vh = innerHeight;
    $$('.stage.in .frame').forEach(fr => { const r = fr.getBoundingClientRect(); if (r.bottom < 0 || r.top > vh) return;
      const t = ((r.top + r.height/2) - vh/2) / vh; $$('img', fr).forEach(im => { if (!im.classList.contains('out')) im.style.transform = `translateY(${(-t*18).toFixed(1)}px) scale(1.06)`; }); }); };
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(run); }, {passive:true}); run();
}
addEventListener('scroll', () => $('#hdr').classList.toggle('scrolled', scrollY > 10), {passive:true});

/* ---------- footer ---------- */

}

/* ---------- boot ---------- */
D.cats.forEach(c => { c.slug = slug(c.name); });
hero(); picker();
$('#stages').innerHTML = D.cats.map((c, i) => stage(c, i)).join('');
