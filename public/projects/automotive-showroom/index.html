<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Salon Noir — Private Automotive Collection</title>
    <meta name="description" content="A private automotive museum and interactive engineering exhibition. Select a car to study its anatomy." />
    <meta name="theme-color" content="#060607" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f2efe9' stroke-width='2'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/projects/automotive-showroom/assets/index-Dyos6XeI.js"></script>
    <link rel="stylesheet" crossorigin href="/projects/automotive-showroom/assets/index-C9KwBy3g.css">
  </head>
  <body>
    <div id="app" class="is-loading" data-state="loading">
      <canvas id="scene" aria-hidden="true"></canvas>

      <!-- Overlay layers (positioned from the 3D scene every frame) -->
      <svg id="leaders" class="leaders" aria-hidden="true"></svg>
      <div id="plaques" class="plaques" role="list" aria-label="Cars in the collection"></div>
      <div id="markers" class="markers" role="list" aria-label="Vehicle anatomy"></div>

      <header class="masthead">
        <button class="brand" type="button" data-action="home" aria-label="Back to the collection">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Salon Noir</span>
          <span class="brand__sub">Private Automotive Collection · Hall I</span>
        </button>
        <nav class="crumbs" aria-label="Location">
          <button type="button" class="crumbs__back" data-action="back">
            <span aria-hidden="true">←</span> <span class="crumbs__label">Collection</span>
          </button>
        </nav>
      </header>

      <div class="exhibit-title" aria-live="polite">
        <p class="exhibit-title__index"></p>
        <h1 class="exhibit-title__name"></h1>
        <p class="exhibit-title__meta"></p>
      </div>

      <section id="detail" class="detail" aria-live="polite" aria-hidden="true">
        <div class="detail__scroll">
          <p class="detail__num"></p>
          <p class="detail__eyebrow"></p>
          <h2 class="detail__name"></h2>
          <p class="detail__text"></p>
          <figure class="detail__figure" hidden></figure>
          <dl class="detail__specs"></dl>
          <p class="detail__materials"></p>
          <p class="detail__source"></p>
        </div>
        <nav class="detail__nav" aria-label="Component navigation">
          <button type="button" data-action="prev" aria-label="Previous component">←</button>
          <span class="detail__count"></span>
          <button type="button" data-action="next" aria-label="Next component">→</button>
          <button type="button" class="detail__close" data-action="close">Close <span aria-hidden="true">✕</span></button>
        </nav>
      </section>

      <p class="hint" aria-live="polite"></p>

      <button type="button" class="credits-btn" data-action="credits">Credits &amp; licences</button>
      <dialog id="credits" class="credits">
        <div class="credits__inner"></div>
        <form method="dialog"><button class="credits__close">Close</button></form>
      </dialog>

      <div class="loader" role="status" aria-live="polite">
        <span class="loader__mark" aria-hidden="true"></span>
        <p class="loader__title">Salon Noir</p>
        <p class="loader__label">Preparing the hall</p>
        <span class="loader__bar"><span class="loader__fill"></span></span>
      </div>

      <noscript><p class="noscript">This exhibition needs JavaScript and WebGL.</p></noscript>
    </div>
  </body>
</html>
